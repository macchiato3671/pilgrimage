name: 기능 추가
description: 새로운 기능 구현 이슈를 작성합니다.
title: "[FEAT] "
labels: ["feat"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: 기능 설명
      description: 구현할 기능을 간단히 설명해주세요.
      placeholder: 예) 관리자 회원 목록 조회 API 구현
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 해야 할 작업을 체크리스트로 작성해주세요.
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: 관련 API
      description: 관련된 API가 있다면 작성해주세요.
      placeholder: |
        GET /api/v1/admin/members
        PATCH /api/v1/admin/members/{memberId}
    validations:
      required: false

  - type: textarea
    id: note
    attributes:
      label: 참고 사항
      description: 추가로 공유할 내용이 있다면 작성해주세요.
    validations:
      required: false