services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: moonbackdb
      MYSQL_USER: moonback
      MYSQL_PASSWORD: moonback
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - pilgrimage-mysql:/var/lib/mysql

  pilgrimage-ingest:
    build: .
    profiles: ["batch"]
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/moonbackdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: moonback
      SPRING_DATASOURCE_PASSWORD: moonback
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      IMAGE_TEMP_DIR: /tmp/pilgrimage-ingest
    command:
      - --spring.batch.job.enabled=true
      - --spring.batch.job.name=pilgrimageIngestJob
      - ingestKey=initial-v1
      - fullScan=true
      - retryFailed=true
      - prune=false

volumes:
  pilgrimage-mysql:
