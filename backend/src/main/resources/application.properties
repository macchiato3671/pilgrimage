spring.application.name=backend
spring.main.allow-bean-definition-overriding=false

# MySQL 연결
spring.datasource.url=jdbc:mysql://70.12.60.171:3306/moonbackdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=moonback
spring.datasource.password=moonback
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns schema changes. Existing non-Flyway schemas are baselined at V1,
# then the import schema migration starts at V2.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Keep the web application from launching batch imports accidentally.
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never

# MyBatis 설정
mybatis.type-aliases-package=com.moonback.pilgrimage.model.dto
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# SQL 로그 확인용
logging.level.com.moonback.pilgrimage=debug

# jwt
jwt.secret=pilgrimage-jwt-secret-key-must-be-at-least-32-bytes
jwt.access-token-expiration=5000000
jwt.refresh-token-expiration=20160

# S3
storage.region=${AWS_REGION:}
storage.bucket=${S3_BUCKET:}
storage.public-base-url=${S3_PUBLIC_BASE_URL:}
storage.presigned-url-expiration=${STORAGE_PRESIGNED_URL_EXPIRATION:10m}
