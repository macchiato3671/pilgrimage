spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:../frontendv2/.env[.properties],optional:file:frontendv2/.env[.properties]
spring.main.allow-bean-definition-overriding=false

# MySQL 연결
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns schema changes. Existing non-Flyway schemas are baselined at V1,
# then the import schema migration starts at V2.
# spring.flyway.enabled=true
# spring.flyway.baseline-on-migrate=true
# spring.flyway.baseline-version=1

# Keep the web application from launching batch imports accidentally.
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never

# MyBatis 설정
mybatis.type-aliases-package=com.moonback.pilgrimage.model.dto
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# SQL 로그 확인용
logging.level.com.moonback.pilgrimage=debug

# jwt
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:5000000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:20160}

# S3
storage.region=${AWS_REGION:}
storage.bucket=${S3_BUCKET:}
storage.public-base-url=${S3_PUBLIC_BASE_URL:}
storage.presigned-url-expiration=${STORAGE_PRESIGNED_URL_EXPIRATION:10m}

