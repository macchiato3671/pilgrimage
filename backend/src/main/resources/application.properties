spring.application.name=backend

# MySQL 연결
spring.datasource.url=jdbc:mysql://localhost:3306/ssafydb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=ssafy
spring.datasource.password=ssafy
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 설정
mybatis.type-aliases-package=com.ssafy.pilgrimage.model.dto
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# SQL 로그 확인용
logging.level.com.ssafy.pilgrimage=debug

# jwt
jwt.secret=pilgrimage-jwt-secret-key-must-be-at-least-32-bytes
jwt.access-token-expiration=5
jwt.refresh-token-expiration=20160