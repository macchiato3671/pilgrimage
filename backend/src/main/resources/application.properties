spring.application.name=backend

# MySQL 연결
spring.datasource.url=jdbc:mysql://localhost:3306/moonbackdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=moonback
spring.datasource.password=moonback
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 설정
mybatis.type-aliases-package=com.moonback.pilgrimage.model.dto
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# SQL 로그 확인용
logging.level.com.moonback.pilgrimage=debug