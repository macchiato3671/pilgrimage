global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: pilgrimage-perf-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080

  - job_name: pilgrimage-perf-mysql
    static_configs:
      - targets:
          - mysqld-exporter:9104
